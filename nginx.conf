server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — the editor has no client-side routing today, but harmless.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets (e.g. /assets/index-XYZ.js, ffmpeg-core, mp4-muxer chunk)
  # are immutable; cache them aggressively.
  location ~* \.(?:css|js|wasm|woff2?|ttf|otf|svg|png|jpg|jpeg|webp|ico|map)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    # Same-origin sub-resource — explicit CORP so COEP=require-corp doesn't
    # block it. The outer Caddy sets COOP/COEP for the document.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  # The HTML shell must never be cached — it pins which hashed bundle to load.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/wasm
    image/svg+xml
    font/woff2;
}
